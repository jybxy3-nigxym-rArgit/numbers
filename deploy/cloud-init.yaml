#cloud-config
# Paste this whole file into the "Cloud-init script" box when you create the server.
# On first boot the server installs and starts the site by itself. No terminal needed.
write_files:
  - path: /root/numbers.conf
    permissions: '0600'
    content: |
      ADMIN_PHONE=0500000000
      REQUIRE_APPROVAL=false
runcmd:
  - [ bash, -c, "curl -fsSL https://raw.githubusercontent.com/jybxy3-nigxym-rArgit/numbers/main/deploy/install.sh -o /root/install-numbers.sh && bash /root/install-numbers.sh" ]
